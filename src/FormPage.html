<!DOCTYPE html>
<html lang="he" dir="rtl"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>עדכון פרטים</title>
<style>:root{--app-bg:#F6F7F8;--surface:#FFFFFF;--surface-muted:#F1F3F5;--text:#202428;--text-muted:#667078;--border:#E1E5E8;--accent:#C62828;--accent-soft:#FCEEEE}
*{box-sizing:border-box}body{margin:0;background:var(--app-bg);font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Hebrew',Arial,sans-serif;color:var(--text);line-height:1.5}main{max-width:520px;margin:0 auto;padding:12px}
.top{display:flex;gap:10px;align-items:center;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;margin:0 0 12px}.top::before{content:'';width:5px;align-self:stretch;background:var(--accent);border-radius:3px}.top b{font-size:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
label{display:block;font-size:14px;margin:14px 0 4px;font-weight:600}input{width:100%;font-size:16px;padding:10px;min-height:44px;border:1px solid #c5ccd1;border-radius:8px;font-family:inherit;background:#fff}
button{font-size:16px;padding:12px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;min-height:48px;margin-top:16px;width:100%;font-family:inherit;font-weight:600}
fieldset{border:1px solid var(--border);border-radius:10px;background:var(--surface-muted);margin:18px 0 0;padding:6px 14px 14px}legend{font-weight:700;padding:0 6px}
.msg{margin-top:10px;font-size:14px}.err{color:#B3261E}.ok{color:#1b6e35}.muted{color:var(--text-muted);font-size:13px}[aria-invalid=true]{border-color:#B3261E!important;outline:1px solid #B3261E}button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid #1a56c4;outline-offset:2px}</style></head>
<body><div class="top"><b>עדכון פרטים</b></div><main><div class="card"><h1 style="margin:0 0 6px;font-size:19px">עדכון פרטים אישיים</h1><p class="muted">הפרטים שתעדכנו יועברו לאישור המ״פ ולא ישתנו לפני האישור. הקישור תקף לשימוש חד־פעמי.</p><div id="box">טוען…</div><div id="msg" class="msg" role="status"></div></div></main>
<script>
var LABELS={full_name:'שם מלא',pakal:'פק״ל',enlistment_date:'תאריך גיוס',emergency_contact_name:'שם מלא של איש הקשר',emergency_contact_relation:'קרבה אליך',emergency_contact_phone:'טלפון של איש הקשר'},TYPES={full_name:'text',pakal:'text',enlistment_date:'date',emergency_contact_phone:'tel'};
function el(t,p,k){var e=document.createElement(t);p=p||{};Object.keys(p).forEach(function(a){if(a==='text')e.textContent=p[a];else if(a.slice(0,2)==='on')e[a]=p[a];else e.setAttribute(a,p[a]);});(k||[]).forEach(function(c){e.appendChild(c);});return e;}
function run(m,a){return new Promise(function(res,rej){google.script.run.withSuccessHandler(res).withFailureHandler(rej)[m].apply(null,a);});}
var TOKEN=(new URLSearchParams(location.search)).get('form')||(window.__TOKEN||'');
function msg(t,ok){var m=document.getElementById('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');}
var MAXLEN={full_name:100,pakal:50,enlistment_date:10,emergency_contact_name:100,emergency_contact_relation:50,emergency_contact_phone:20};
/* same rules as the server (Soldiers.clean_) — the server stays authoritative; this only avoids a round trip and tells the person WHICH field is wrong */
function fieldError(f,v){v=String(v).trim();if(f==='full_name'&&(!v||v.length>100))return 'שם מלא חובה (עד 100 תווים).';if(f==='pakal'&&v.length>50)return 'פק״ל ארוך מדי (עד 50 תווים).';if(f==='emergency_contact_phone'&&v!==''&&!/^\+?[\d\s\-().]{7,20}$/.test(v)||f==='emergency_contact_phone'&&v!==''&&v.replace(/\D/g,'').length<7)return 'יש להזין מספר טלפון תקין (לפחות 7 ספרות).';if((f==='emergency_contact_name'||f==='emergency_contact_relation')&&v!==''&&v.length<2)return 'יש להזין לפחות 2 תווים.';if(f==='enlistment_date'&&v!==''&&!/^\d{4}-\d{2}-\d{2}$/.test(v))return 'יש להזין תאריך תקין.';return '';}
run('formOpen',[TOKEN]).then(function(r){var b=document.getElementById('box');b.textContent='';if(!r.ok){b.appendChild(el('p',{class:'err',role:'alert',text:'הקישור אינו תקף או שכבר נוצל. יש לפנות למ״פ.'}));return;}
 var ins={},errs={};r.data.fields.forEach(function(f){var i=el('input',{id:'f_'+f,type:TYPES[f]||'text',maxlength:String(MAXLEN[f]||80),'aria-describedby':'e_'+f,autocomplete:'off'}),e=el('div',{id:'e_'+f,class:'msg err',hidden:true});if(f==='full_name')i.setAttribute('aria-required','true');i.value=r.data.current[f]||'';ins[f]=i;errs[f]=e;
   i.addEventListener('input',function(){e.hidden=true;e.textContent='';i.removeAttribute('aria-invalid');});b.appendChild(el('label',{for:'f_'+f,text:LABELS[f]||f}));b.appendChild(i);b.appendChild(e);});
 var EK=r.data.emergency_fields||[];if(EK.length){var fs=el('fieldset',{id:'ecSet'},[el('legend',{text:'איש קשר לחירום'}),el('p',{class:'muted',text:'אפשר להוסיף איש קשר אחד לשימוש בחירום בלבד. הפרטים יועברו לאישור, יהיו גלויים למנהל המערכת בלבד ולא יוצגו ברשימות או בדוחות. לא נציג כאן פרטים שנשמרו בעבר. אפשר להשאיר ריק — ואז למלא את שלושת השדות יחד.'})]);
   EK.forEach(function(f){var i=el('input',{id:'f_'+f,type:TYPES[f]||'text',maxlength:String(MAXLEN[f]||80),'aria-describedby':'e_'+f,autocomplete:'off'}),e=el('div',{id:'e_'+f,class:'msg err',hidden:true});if(f==='emergency_contact_phone'){i.setAttribute('dir','ltr');i.setAttribute('inputmode','tel');}ins[f]=i;errs[f]=e;
     i.addEventListener('input',function(){e.hidden=true;e.textContent='';i.removeAttribute('aria-invalid');});fs.appendChild(el('label',{for:'f_'+f,text:LABELS[f]}));fs.appendChild(i);fs.appendChild(e);});b.appendChild(fs);}
 var btn=el('button',{id:'send',text:'שליחה לאישור',onclick:function(){var p={},bad=null;
   var ek=EK.filter(function(f){return ins[f].value.trim()!=='';});if(ek.length&&ek.length<EK.length){EK.forEach(function(f){if(!ins[f].value.trim()){errs[f].textContent='יש למלא את שלושת פרטי איש הקשר או להשאיר את כולם ריקים.';errs[f].hidden=false;ins[f].setAttribute('aria-invalid','true');if(!bad)bad=ins[f];}});}
   r.data.fields.concat(EK).forEach(function(f){var v=ins[f].value.trim(),msgE=fieldError(f,ins[f].value);if(msgE){errs[f].textContent=msgE;errs[f].hidden=false;ins[f].setAttribute('aria-invalid','true');if(!bad)bad=ins[f];}else if(EK.indexOf(f)!==-1){if(v!=='')p[f]=v;}else if(v!==String(r.data.current[f]||'').trim())p[f]=v;});
   if(bad){bad.focus();msg('יש לתקן את השדות המסומנים. לא נשלח דבר.',false);return;}
   if(!Object.keys(p).length){msg('לא בוצע שינוי — אין מה לשלוח.',false);return;}
   btn.disabled=true;btn.textContent='שולח…';
   run('formSubmit',[TOKEN,p]).then(function(x){if(x.ok){b.textContent='';msg('הבקשה נשלחה לאישור המ״פ. תודה — אפשר לסגור את הדף.',true);}else{msg(x.message||'השליחה נכשלה.',false);btn.disabled=false;btn.textContent='שליחה לאישור';}},function(){msg('שגיאת תקשורת. הנתונים שהוזנו נשארו בדף — נסו שוב.',false);btn.disabled=false;btn.textContent='שליחה לאישור';});}});b.appendChild(btn);},function(){var bx=document.getElementById('box');bx.textContent='';bx.appendChild(el('p',{class:'err',role:'alert',text:'שגיאת תקשורת. טענו את הדף מחדש.'}));});
</script></body></html>
