<style>

button{background:var(--accent);font-family:inherit}button.sec{background:var(--surface-muted);color:var(--text);border:1px solid var(--border)}button.danger{background:var(--bad)}

/* UX sprint 1: persistent context line, global network progress bar, small-phone (360px) hardening */

/* UX final pass: compact course toolbar, adaptive form grid, neutral notices, tidy empty states, "show more" for long tables */
.card.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px}.card.toolbar label{margin:0;font-weight:600}.card.toolbar select{width:auto;min-width:220px;max-width:100%;padding:7px 10px;font-size:15px}.card.toolbar .msg{margin:0;font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{border:1px solid #e1e5e8;border-radius:8px;padding:10px 12px;background:#f6f7f8}.kpi .kv{font-size:22px;font-weight:700}.kpi .kl{font-size:12.5px;color:#5b6470}

details.flt{border:1px solid #e1e5e8;border-radius:8px;padding:6px 12px;margin:10px 0;background:#fafbfc}details.flt>summary{cursor:pointer;font-size:14px;font-weight:600;min-height:44px;display:flex;align-items:center}

@media(max-width:700px){#stageNotice{font-size:12.5px;padding:7px 10px}.hdr small,header small{font-size:11px}}

#tabs[hidden]{display:none}
.req{color:var(--bad)}
.chk{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-height:44px;margin-top:10px}.chk input[type=checkbox]{width:24px;height:24px;margin:0;flex:0 0 auto}.chk label{margin:0;flex:1 1 auto;font-size:14px}.chk .ferr{flex-basis:100%}

.rowbtn:hover{background:transparent;color:#8e1d1d}

<body>
<header class="top"><button id="menuBtn" type="button" aria-label="פתיחת תפריט ניווט" aria-expanded="false" aria-controls="side">☰</button><div class="brand"><h1>מערכת מעקב קורס</h1><p id="who">טוען…</p><p id="ctx" class="ctx" aria-live="polite"></p></div></header>
<div id="netbar" aria-hidden="true"></div><div id="offline" class="notice hide" role="status">אין חיבור לאינטרנט — פעולות לא יישלחו עד לחזרת החיבור.</div>
<div class="shell">
<aside id="side" aria-label="ניווט ראשי"><h2>תחומי המערכת</h2><nav id="grps" class="bar grps" aria-label="תחומי המערכת"></nav></aside>
<div id="scrim" aria-hidden="true"></div>
<main>
  <div class="notice" id="stageNotice">עותק הכנה ל-Staging עם שערי קבלה פתוחים — לא מוכן לשימוש מבצעי. אין להזין נתוני אמת לפני אישור אבטחת מידע.</div>
  <section class="card toolbar"><label for="course">קורס</label><select id="course"></select><div id="org" class="msg muted"></div></section>
  <div id="mineMsg" class="notice hide" role="status"></div>
  <div id="tabs" class="bar" aria-label="מסכים בתחום" hidden></div>
  <div id="view"></div>
</main>
</div>
<script>
/* All server data is rendered with textContent / DOM nodes only (never innerHTML) — names and notes are untrusted. */
/* UX sprint 1: every server call goes through here. (a) an IDENTICAL call (same method + arguments) that is still in flight is shared instead of sent twice — this makes a double tap on any save button a single submission and
   de-duplicates repeated reads; (b) a global progress bar + aria-busy tells the user something is happening. Data contracts, arguments and results are unchanged. */
var NET={n:0,live:{}};
function netBusy(d){NET.n=Math.max(0,NET.n+d);if(document.body)document.body.setAttribute('aria-busy',NET.n>0?'true':'false');}
function call(method,args){var a=args||{},key;try{key=method+'\u0001'+JSON.stringify(a);}catch(e){key=null;}
  if(key&&NET.live[key])return NET.live[key];
  var p=new Promise(function(res,rej){google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(e)}).api(method,a);});
  netBusy(1);var fin=function(){if(key&&NET.live[key]===p)delete NET.live[key];netBusy(-1);};if(key)NET.live[key]=p;p.then(fin,fin);return p;}
var S={ctx:null,courses:[],courseId:null,org:{departments:[],teams:[]},tab:'dash',mine:{course_wide:true,has_assignment:true,department_ids:[],team_ids:[]},types:[],users:[],reqId:null,navF:{departmentId:'',teamId:'',typeId:'',from:'',to:'',includeCancelled:false},filters:{q:'',departmentId:'',teamId:'',pakal:'',active:'',includeCancelled:false},soldiers:[]};
var ACTION={SOLDIER_CREATE:'נוצר',SOLDIER_EDIT:'עריכת פרטים',SOLDIER_REASSIGN:'שינוי שיוך',SOLDIER_ACTIVITY:'שינוי סטטוס פעילות',SOLDIER_CANCEL:'ביטול',SOLDIER_RESTORE:'שחזור'};
function $(id){return document.getElementById(id);}
function el(tag,props,kids){var e=document.createElement(tag);props=props||{};Object.keys(props).forEach(function(k){
  if(k==='text')e.textContent=props[k];else if(k==='class')e.className=props[k];else if(k.slice(0,2)==='on')e[k]=props[k];else if(k==='value')e.value=props[k];else if(props[k]!==false&&props[k]!==null&&props[k]!==undefined)e.setAttribute(k,props[k]===true?'':props[k]);});
  (kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});return e;}
function setMsg(e,t,ok){e.textContent=t;e.className='msg '+(ok?'ok':'err');}
function isAdmin(){return S.ctx&&S.ctx.role==='admin';}
function depName(id){var d=S.org.departments.filter(function(x){return x.id===id})[0];return d?d.name:'';}
function teamName(id){var d=S.org.teams.filter(function(x){return x.id===id})[0];return d?d.name:'';}
function course(){return S.courses.filter(function(c){return c.id===S.courseId})[0]||{};}
function archived(){return course().status==='archived';}
function started(){var s=course().start_date;return !!s&&String(s)<=new Date().toISOString().slice(0,10);}
function fail(e,box){setMsg(box,e&&e.message?e.message:'שגיאת תקשורת. נסו שוב.',false);}
function selectOf(items,val,blank){var s=el('select');if(blank!==undefined)s.appendChild(el('option',{value:'',text:blank}));items.forEach(function(i){s.appendChild(el('option',{value:i.id,text:i.name}));});s.value=val||'';return s;}
function wide(){return isAdmin()||S.mine.course_wide;}
function depsAllowed(){return S.org.departments.filter(function(d){return wide()||S.mine.department_ids.indexOf(d.id)!==-1;});}
function teamsOf(dep){return S.org.teams.filter(function(t){return (!dep||t.department_id===dep)&&(wide()||S.mine.team_ids.indexOf(t.id)!==-1);});}

/* UX sprint 1: persistent context (selected course + current screen) in the sticky header, and an offline notice. Read-only DOM observers; no data is touched. */
function updateCtx(){var c=$('course'),o=c&&c.options&&c.options[c.selectedIndex],on=document.querySelector('#tabs .tab.on'),g=document.querySelector('#grps button[aria-current],#grps button.on'),x=$('ctx');if(!x)return;
  var parts=[];if(o&&o.value)parts.push('קורס: '+o.text);if(g&&g.textContent)parts.push(g.textContent.trim());if(on&&on.textContent&&(!g||on.textContent.trim()!==g.textContent.trim()))parts.push(on.textContent.trim());x.textContent=parts.join(' · ');}
(function(){var ob=new MutationObserver(updateCtx);['tabs','grps','course'].forEach(function(id){var n=$(id);if(n)ob.observe(n,{subtree:true,childList:true,attributes:true});});$('course').addEventListener('change',updateCtx);
  function net(){var off=$('offline');if(off)off.classList.toggle('hide',navigator.onLine!==false);}window.addEventListener('online',net);window.addEventListener('offline',net);net();})();
google.script.run.withSuccessHandler(function(r){
  if(!r.ok){$('who').textContent=r.message;return;}

(function(){var mb=$('menuBtn'),sc=$('scrim'),side=$('side'),grps=$('grps'),mq=window.matchMedia('(max-width:900px)');
  var bgs=function(){return [document.querySelector('header.top'),document.querySelector('main')];};
  side.insertBefore(el('button',{id:'navClose',type:'button',class:'sec','aria-label':'סגירת תפריט ניווט',text:'✕ סגירה'}),side.firstChild);
  function isOpen(){return document.body.classList.contains('nav-open');}
  function bg(on){bgs().forEach(function(n){if(!n)return;if(on){n.setAttribute('inert','');n.setAttribute('aria-hidden','true');}else{n.removeAttribute('inert');n.removeAttribute('aria-hidden');}});}
  function open(){document.body.classList.add('nav-open');mb.setAttribute('aria-expanded','true');bg(true);side.setAttribute('role','dialog');side.setAttribute('aria-modal','true');side.setAttribute('aria-label','תפריט ניווט');
    var f=grps.querySelector('button.on')||$('navClose');if(f)f.focus();}
  function close(where){if(!isOpen())return;document.body.classList.remove('nav-open');mb.setAttribute('aria-expanded','false');bg(false);side.removeAttribute('role');side.removeAttribute('aria-modal');side.setAttribute('aria-label','ניווט ראשי');
    if(where==='menu')mb.focus();else if(where==='heading')focusHeading();}
  mb.onclick=function(){if(isOpen())close('menu');else open();};sc.onclick=function(){close('menu');};$('navClose').onclick=function(){close('menu');};
  document.addEventListener('keydown',function(e){if(!isOpen())return;if(e.key==='Escape'){e.preventDefault();close('menu');return;}
    if(e.key==='Tab'){var f=Array.prototype.filter.call(side.querySelectorAll('button:not([disabled])'),function(b){return b.offsetParent!==null;});if(!f.length)return;var first=f[0],last=f[f.length-1],cur=document.activeElement;
      if(!side.contains(cur)){e.preventDefault();first.focus();}else if(e.shiftKey&&cur===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&cur===last){e.preventDefault();first.focus();}}});
  grps.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('button'))close('heading');});
  var chg=function(m){if(!m.matches&&isOpen())close('none');};if(mq.addEventListener)mq.addEventListener('change',chg);else if(mq.addListener)mq.addListener(chg);})();

/* ===== R5.2.16 — accessibility safety net for every screen (runs after DOM changes, idempotent, attribute-only so it never re-triggers itself) =====
   · tables: th scope, accessible name (nearest heading), explicit table roles on the responsive (card-like) layout so headers stay associated with cells on a phone
   · controls: a label that sits right before a control without an id/for gets connected; any control that is still unnamed gets its placeholder/title as aria-label */
var A11Y={seq:0,raf:0};
function a11yName(c){return (c.labels&&c.labels.length)||c.getAttribute('aria-label')||c.getAttribute('aria-labelledby')||c.getAttribute('title');}
function a11yTableName(t){var c=t.closest('.card,section,.tw')||t.parentNode,h=null;for(var n=c;n&&!h&&n!==document.body;n=n.parentNode){h=n.querySelector&&n.querySelector('h2,h3,h4');if(h&&h.contains(t))h=null;}return (h&&h.textContent.trim())||'טבלת נתונים';}
function a11yEnhance(){
  Array.prototype.forEach.call(document.querySelectorAll('table'),function(t){
    Array.prototype.forEach.call(t.querySelectorAll('th'),function(h){if(!h.getAttribute('scope'))h.setAttribute('scope',h.closest('thead')?'col':'row');});
    if(!t.getAttribute('aria-label')&&!t.querySelector('caption'))t.setAttribute('aria-label',a11yTableName(t));
    if(t.classList.contains('resp')){t.setAttribute('role','table');Array.prototype.forEach.call(t.querySelectorAll('thead,tbody,tfoot'),function(x){x.setAttribute('role','rowgroup');});Array.prototype.forEach.call(t.querySelectorAll('tr'),function(x){x.setAttribute('role','row');});Array.prototype.forEach.call(t.querySelectorAll('th'),function(x){x.setAttribute('role',x.getAttribute('scope')==='row'?'rowheader':'columnheader');});Array.prototype.forEach.call(t.querySelectorAll('td'),function(x){x.setAttribute('role','cell');});}
    var w=t.closest('.tw');if(w&&!w.getAttribute('role')&&w.scrollWidth>w.clientWidth+1){w.setAttribute('role','region');w.setAttribute('tabindex','0');w.classList.add('twscroll');w.setAttribute('aria-label',(t.getAttribute('aria-label')||'טבלה')+' — ניתן לגלילה אופקית');}});
  Array.prototype.forEach.call(document.querySelectorAll('input,select,textarea'),function(c){if(c.type==='hidden'||c.type==='submit'||c.type==='button')return;if(a11yName(c))return;
    var lab=null;for(var p=c.previousElementSibling;p;p=p.previousElementSibling){if(p.tagName==='LABEL'&&!p.htmlFor&&!p.querySelector('input,select,textarea')){lab=p;break;}if(/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(p.tagName))break;}
    if(lab){if(!c.id)c.id='a11y_'+(++A11Y.seq);lab.htmlFor=c.id;}else{var t=c.getAttribute('placeholder');if(t)c.setAttribute('aria-label',t);}});
  Array.prototype.forEach.call(document.querySelectorAll('button'),function(b){if(!b.getAttribute('type'))b.setAttribute('type','button');if(!b.textContent.trim()&&!b.getAttribute('aria-label')&&!b.getAttribute('title'))b.setAttribute('aria-label','פעולה');});}
(function(){var mo=new MutationObserver(function(){if(A11Y.raf)return;A11Y.raf=requestAnimationFrame(function(){A11Y.raf=0;try{a11yEnhance();}catch(e){}});});mo.observe(document.body,{childList:true,subtree:true});try{a11yEnhance();}catch(e){}})();
</script>
