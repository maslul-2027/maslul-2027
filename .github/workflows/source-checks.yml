name: Source checks (no deployment)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          for file in .clasp.json .clasprc.json .env credentials.json; do
            if [ -e "$file" ]; then
              echo "Forbidden local credential/binding file: $file" >&2
              exit 1
            fi
          done
      - name: Set up Node.js 22
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install test dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Install browser dependencies
        if: hashFiles('package-lock.json') != ''
        run: npx playwright install --with-deps chromium
      - name: Run source tests
        if: hashFiles('package-lock.json') != ''
        run: npm run test:ci

# Deployment intentionally disabled until credentials, baseline reconciliation,
# versioned /exec update and rollback are validated.
