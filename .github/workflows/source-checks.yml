name: Source checks (deployment disabled)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files anywhere in repository
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(\.clasp\.json|\.clasprc\.json|\.env(\..*)?|credentials\.json|service-account[^/]*\.json|[^/]*\.(pem|p12|pfx|key))$'; then
            echo 'Credential-like files must not be committed.' >&2
            exit 1
          fi
      - name: Check source layout
        shell: bash
        run: |
          if [ -f package.json ] && [ ! -d src ]; then
            echo 'package.json exists but src/ is missing.' >&2
            exit 1
          fi

  tests:
    if: ${{ hashFiles('package-lock.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci

# No deploy job. Google Apps Script deployment requires separately validated
# credentials, source reconciliation and versioned deployment/rollback.
