name: Source checks (no deployment)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Contract route parity (174 original routes preserved; only reviewed additions)
        run: node scripts/check_contract_route_parity.js
      - name: Check repository hygiene (no credentials / local bindings)
        shell: bash
        run: |
          set -euo pipefail
          for file in .clasp.json .clasprc.json .env credentials.json; do
            if [ -e "$file" ]; then
              echo "Forbidden local credential/binding file: $file" >&2
              exit 1
            fi
          done
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        shell: bash
        run: |
          # package-lock.json is intentionally NOT committed yet (it must come from npm on a networked machine, never hand-written).
          # With a lock: reproducible `npm ci`. Without it: `npm install` against the exact pin in package.json (playwright 1.63.0) and
          # the generated lock is uploaded as an artifact for the owner to review and commit.
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Upload generated lock file (only when none is committed)
        if: hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: ignore
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium
      - name: PDF/XLSX verification tools (qpdf, poppler, openpyxl) — the privacy tests parse the real generated files
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf poppler-utils python3-openpyxl
      - name: Source identity + strict test run (Node + UI, 0 skips allowed)
        run: npm run test:ci

# Deployment intentionally disabled until credentials, baseline reconciliation,
# versioned /exec update and rollback are validated (see docs/DEPLOYMENT_PLAN.md).
