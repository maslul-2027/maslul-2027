name: Cloudflare TEST deploy (Actions -> Wrangler; manual approval; synthetic data only)
# Alternative to the Cloudflare GitHub integration (which cannot be connected): this workflow deploys cloudflare/free-shared-test as Worker "maslul-test" with D1 binding DB.
#  * Nothing deploys by accident. The `verify` job (build + static checks + `wrangler deploy --dry-run`) runs on every push to the dedicated branch and has NO secrets.
#  * The `deploy` job needs ALL of: (1) repository variable CF_DEPLOY_ENABLED = yes (set by the owner at GO time), (2) the GitHub Environment `cloudflare-test`
#    with the owner as required reviewer (a human clicks "Approve"), (3) the two Cloudflare secrets, which exist ONLY as secrets of that environment.
#  * Never main, never Pages. APP_SECRET / BOOTSTRAP_TOKEN are NOT GitHub secrets: they are set once in the Cloudflare dashboard as Worker secrets.
#  * GitHub shows the "Run workflow" button only for workflows on the default branch; for this branch-only file the approval path is the push run itself
#    (Actions -> latest run on this branch -> Review deployments -> Approve, or "Re-run all jobs" after setting the variable). workflow_dispatch is declared so that
#    `gh workflow run cloudflare-deploy-test.yml --ref cloudflare/free-shared-test` also works once the file has run at least once on the branch.
on:
  workflow_dispatch:
  push:
    branches: [cloudflare/free-shared-test]
    paths:
      - 'cloudflare/**'
      - 'native/**'
      - 'src/**'
      - 'backend_next/**'
      - 'scripts/build_cf_worker.js'
      - 'scripts/build_native_app.js'
      - 'scripts/cf_ci_deploy_prepare.js'
      - '.github/workflows/cloudflare-deploy-test.yml'
permissions:
  contents: read
concurrency:
  group: cloudflare-deploy-test
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler (version from package.json) and print it
        working-directory: cloudflare/free-shared-test
        run: |
          npm install --no-audit --no-fund
          npx wrangler --version
      - name: Build engine + static app
        run: |
          node scripts/build_cf_worker.js
          node scripts/build_native_app.js --cf
      - name: Static guards (free-plan shape, no eval, no PIN path, helper + workflow rules)
        run: node tests/cf_static.js
      - name: Deploy dry run (uploads nothing, needs no credentials)
        working-directory: cloudflare/free-shared-test
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dryrun" 2>&1 | tee "$RUNNER_TEMP/dryrun.txt" | grep -E "Total Upload|Your Worker|binding|DB"
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/cloudflare/free-shared-test' && vars.CF_DEPLOY_ENABLED == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cloudflare-test
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Preflight (values are never printed)
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are missing from the cloudflare-test environment secrets"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler
        working-directory: cloudflare/free-shared-test
        run: npm install --no-audit --no-fund && npx wrangler --version
      - name: Build engine + static app
        run: |
          node scripts/build_cf_worker.js
          node scripts/build_native_app.js --cf
      - name: Who am I (confirms the token reaches the intended Free account; prints no token)
        working-directory: cloudflare/free-shared-test
        run: npx wrangler whoami
      - name: Ensure D1 database maslul-test-db exists and write the deploy-only config
        run: node scripts/cf_ci_deploy_prepare.js
      - name: Dry run with the real binding
        working-directory: cloudflare/free-shared-test
        run: npx wrangler deploy --config wrangler.deploy.toml --dry-run --outdir "$RUNNER_TEMP/dryrun2"
      - name: Deploy Worker maslul-test (workers.dev, Free plan)
        id: deploy
        working-directory: cloudflare/free-shared-test
        run: |
          npx wrangler deploy --config wrangler.deploy.toml 2>&1 | tee "$RUNNER_TEMP/deploy.txt"
          URL="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.txt" | head -1)"
          [ -n "$URL" ] || { echo "::error::could not find the workers.dev URL in the deploy output"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Smoke test (read-only; two stages; no data is written)
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Stage 1 = first deploy, Worker secrets not set yet: expected, fails closed, reported as NOT READY (never as finished).
          # Stage 2 = secrets set (re-run this workflow): data routes need a session, headers present, reported as READY.
          node scripts/cf_ci_smoke.js "$URL" | tee smoke.txt
          if grep -q 'READY=true' smoke.txt; then
            echo "Deployed and configured (synthetic TEST only): $URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::DEPLOYED BUT NOT READY - the Worker secrets are not set yet. Set them in the Cloudflare dashboard (owner guide), then re-run this workflow to get READY."
            echo "### NOT READY - first deploy, Worker secrets missing" >> "$GITHUB_STEP_SUMMARY"
            echo "$URL is deployed but fails closed until the two Worker secrets are added in Cloudflare. Then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
