name: Mobile preview static checks
on:
  pull_request:
    paths: ['preview/**','scripts/test_preview.cjs','.github/workflows/preview-checks.yml']
  push:
    branches: [main]
    paths: ['preview/**','scripts/test_preview.cjs','.github/workflows/preview-checks.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build_native_app.js
      - run: git diff --exit-code -- preview/index.html preview/engine.js
      - run: node scripts/test_preview.cjs
