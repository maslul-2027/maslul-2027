name: Cloudflare Free shared test (Workers + D1, local runtime)
# Proves the shared-test package WITHOUT any Cloudflare account, secret or network deploy:
#   job "shim"    : static guards + 22 end-to-end scenarios against the real engine on a SQLite D1 shim + CPU/statement budget table
#   job "workerd" : the SAME scenarios over HTTP against `wrangler dev --local` (workerd + local D1 migrations) + two-phone browser E2E + `wrangler deploy --dry-run`
# Nothing here deploys, publishes Pages, or touches main. Synthetic data only. What cannot be shown without an account is listed in docs/CLOUDFLARE_FREE_TEST.md (NOT_RUN).
on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'scripts/build_cf_worker.js'
      - 'scripts/build_native_app.js'
      - 'scripts/cf_*.js'
      - 'scripts/ci_cf_workerd.sh'
      - 'scripts/e2e_cf_browser.js'
      - 'scripts/e2e_cf_motion.js'
      - 'scripts/e2e_cf_bulk.js'
      - 'scripts/e2e_cf_bulk_modules.js'
      - 'scripts/cf_auth_screens.js'
      - 'scripts/lib/cf_harness.js'
      - 'tests/cf_*.js'
      - 'tests/lib/d1_shim.js'
      - 'native/**'
      - 'src/**'
      - '.github/workflows/cloudflare-free-test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cf-free-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shim:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build_cf_worker.js
      - run: node scripts/build_native_app.js --cf
      - run: node tests/cf_static.js
      - run: node scripts/cf_route_survey.js
      - run: node tests/cf_worker.js
      - run: node scripts/cf_cpu_bench.js | tee cf_cpu_bench.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf-shim-evidence
          path: |
            cf_cpu_bench.txt
            docs/evidence_cf_cpu_bench.json
            docs/evidence_cf_route_survey.json

  workerd:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler (pinned by package.json) and Playwright Chromium
        working-directory: cloudflare/free-shared-test
        run: |
          npm install --no-audit --no-fund
          npx wrangler --version
          npm install --no-save --no-audit --no-fund playwright@1.56.1 --prefix "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build (engine + static app)
        run: |
          node scripts/build_cf_worker.js
          node scripts/build_native_app.js --cf
      - name: Deploy dry run (bundle must fit the Free plan, nothing is uploaded)
        working-directory: cloudflare/free-shared-test
        run: |
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dryrun" 2>&1 | tee "$RUNNER_TEMP/dryrun.txt"
          grep -E "Total Upload" "$RUNNER_TEMP/dryrun.txt"
      - name: PDF/XLSX verification tools (qpdf, poppler, openpyxl) for the insight/report E2E
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf poppler-utils python3-openpyxl
      - name: workerd + local D1 - HTTP scenarios, then two-phone browser E2E (server and tests in one shell)
        timeout-minutes: 20
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: bash scripts/ci_cf_workerd.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf-workerd-evidence
          path: |
            artifacts/cf_browser
            artifacts/cf_screens
            ${{ runner.temp }}/dryrun.txt
            ${{ runner.temp }}/wrangler.log
            ${{ runner.temp }}/wrangler2.log
