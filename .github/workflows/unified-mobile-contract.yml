name: Unified mobile experience gate
on:
  pull_request:
    paths: ['preview/**','scripts/test_unified_mobile_contract.cjs','.github/workflows/unified-mobile-contract.yml']
permissions:
  contents: read
jobs:
  unified:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_unified_mobile_contract.cjs
