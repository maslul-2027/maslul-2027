name: Deploy synthetic PWA preview to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['preview/**', '.github/workflows/preview-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert synthetic-only preview and no backend secrets
        run: |
          test -f preview/index.html
          test -f preview/manifest.webmanifest
          ! grep -E -i '(AKfycb[A-Za-z0-9_-]+|script.google.com/macros|BEGIN PRIVATE KEY|client_secret)' preview/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - id: deployment
        uses: actions/deploy-pages@v4
