name: Native mobile app browser E2E + design parity
on:
  pull_request:
    paths:
      - 'preview/**'
      - 'native/**'
      - 'src/**'
      - 'scripts/build_native_app.js'
      - 'scripts/lib/**'
      - 'backend_next/**'
      - 'tests/secure_test_server.js'
      - 'tests/route_table.js'
      - 'tests/private_net.js'
      - 'tests/private_test_launch.js'
      - 'scripts/private_test_probe.js'
      - 'scripts/e2e_secure_browser.js'
      - 'scripts/e2e_report_export_browser.js'
      - 'scripts/e2e_backup_restore_browser.js'
      - 'scripts/e2e_documents_browser.js'
      - 'scripts/e2e_native.js'
      - 'scripts/e2e_upgrade_rollback_data.js'
      - 'scripts/e2e_native_domains.js'
      - 'scripts/e2e_native_roles.js'
      - 'scripts/e2e_native_home.js'
      - 'scripts/e2e_native_batch3.js'
      - 'scripts/e2e_native_card.js'
      - 'scripts/e2e_native_batch5.js'
      - 'scripts/e2e_native_ux.js'
      - 'scripts/e2e_native_motion.js'
      - 'scripts/e2e_native_sheets.js'
      - 'scripts/e2e_native_bulk_nav.js'
      - 'scripts/e2e_native_bulk_modules.js'
      - 'scripts/e2e_native_mgmt.js'
      - 'scripts/e2e_native_bulk_reliability.js'
      - 'scripts/e2e_native_entry.js'
      - 'scripts/e2e_native_insight.js'
      - 'scripts/e2e_native_course_privacy.js'
      - 'scripts/e2e_native_exam_insight.js'
      - 'scripts/e2e_native_shoot_insight.js'
      - 'scripts/e2e_native_fit_insight.js'
      - 'native/insight_exams.js'
      - 'native/insight_shoot.js'
      - 'native/insight_fit.js'
      - 'scripts/e2e_native_insight_privacy.js'
      - 'scripts/test_reportkit.js'
      - 'scripts/lib/reportkit_node.js'
      - 'native/entry.js'
      - 'scripts/test_hebrew_lint.js'
      - 'native/mgmt.js'
      - 'scripts/e2e_native_qa.js'
      - 'scripts/e2e_native_batch6.js'
      - 'scripts/e2e_native_batch7.js'
      - 'scripts/e2e_native_marches.js'
      - 'scripts/e2e_native_acceptance.js'
      - 'scripts/e2e_native_flows.js'
      - 'scripts/e2e_native_fitness.js'
      - 'scripts/build_release_package.js'
      - 'scripts/e2e_release_package.js'
      - 'release/**'
      - 'backend_next/selfsigned.js'
      - 'tests/fitness_regular.js'
      - 'scripts/e2e_native_tasks.js'
      - 'scripts/build_route_ledger.js'
      - 'scripts/check_contract_route_parity.js'
      - 'docs/capability-inventory.json'
      - 'scripts/check_route_ledger.js'
      - 'scripts/build_env_ledger.js'
      - 'docs/CAPABILITIES_BY_ENVIRONMENT.md'
      - 'scripts/native_screenshots.js'
      - '.github/workflows/mobile-browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned original PR 10 visual reference
        uses: actions/checkout@v4
        with:
          ref: a2f70692d0b6fe112cdc38a3f03d2ca799e46e36
          path: golden-source
          sparse-checkout: |
            preview/index.html
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install chromium
      - run: node scripts/build_native_app.js
      - run: git diff --exit-code -- preview/index.html preview/engine.js
      - run: node scripts/test_unified_mobile_contract.cjs
      - run: mkdir -p artifacts
      - run: E2E_CALLS_OUT=artifacts/calls_native.json node scripts/e2e_native.js preview
      - run: E2E_CALLS_OUT=artifacts/calls_native_domains.json node scripts/e2e_native_domains.js preview
      - run: E2E_CALLS_OUT=artifacts/calls_native_roles.json node scripts/e2e_native_roles.js preview
      - run: E2E_CALLS_OUT=artifacts/calls_native_home.json node scripts/e2e_native_home.js preview artifacts/home_screens
      - run: E2E_CALLS_OUT=artifacts/calls_native_batch3.json node scripts/e2e_native_batch3.js preview artifacts/batch3_screens
      - run: E2E_CALLS_OUT=artifacts/calls_native_card.json node scripts/e2e_native_card.js preview
      - run: E2E_CALLS_OUT=artifacts/calls_native_batch5.json node scripts/e2e_native_batch5.js preview
      - run: E2E_CALLS_OUT=artifacts/calls_native_qa.json node scripts/e2e_native_qa.js preview artifacts/qa_screens
      - run: E2E_CALLS_OUT=artifacts/calls_native_batch6.json node scripts/e2e_native_batch6.js preview artifacts/batch6_screens
      - run: E2E_CALLS_OUT=artifacts/calls_native_batch7.json node scripts/e2e_native_batch7.js preview artifacts/batch7_screens
      - name: Meniv-inspired flows (#76) — guided creation, review, saved roster, states, motion, keyboard, 200% zoom
        run: E2E_CALLS_OUT=artifacts/calls_native_flows.json node scripts/e2e_native_flows.js preview artifacts/flows_screens
      - name: March roster + scope (#79) — Home → new march → missing → persisted roster; scoped commander
        run: E2E_CALLS_OUT=artifacts/calls_native_marches.json node scripts/e2e_native_marches.js preview
      - name: Owner-acceptance regression (event edit-after-save, double submit, refresh persistence, commander/approval, foreign scope, offline, RTL 320-414, 200% zoom, keyboard, reduced motion)
        run: node scripts/e2e_native_acceptance.js preview
      - name: Upgrade and rollback keep the owner's local data (baseline 7a81b07 -> candidate -> baseline, same origin)
        run: |
          git fetch -q --depth=1 origin 7a81b0794a83053c2d2db5ac217507c56cda44a5
          node scripts/e2e_upgrade_rollback_data.js 7a81b0794a83053c2d2db5ac217507c56cda44a5 preview
      - name: Fitness regular-only entry, live preview, scoring reference (Issue #66)
        run: |
          node tests/fitness_regular.js
          E2E_CALLS_OUT=artifacts/calls_native_fitness.json node scripts/e2e_native_fitness.js preview artifacts/fitness_screens
      - run: E2E_CALLS_OUT=artifacts/calls_native_tasks.json node scripts/e2e_native_tasks.js preview artifacts/tasks_screens
      - name: Private TEST server — secure API tests over real TLS (Issue #43)
        run: |
          node scripts/build_native_app.js --server
          node tests/route_table.js
          node tests/secure_test_server.js
          node tests/private_net.js
          node tests/private_test_launch.js
      - name: Private TEST server — browser E2E over real TLS, admin/commander/viewer at 320/360/390/414 (Issue #43)
        run: |
          node scripts/build_native_app.js --server
          SHOTS_DIR=artifacts/secure_screens node scripts/e2e_secure_browser.js
      - name: Real report export (Issue #72 part 1) — admin clicks the native UI, the browser performs a REAL PDF/XLSX download; commander/viewer get nothing
        run: |
          node scripts/build_native_app.js --server
          DL_DIR=artifacts/report_downloads SHOTS_DIR=artifacts/report_screens E2E_CALLS_OUT=artifacts/secure_calls_reports.json node scripts/e2e_report_export_browser.js
      - name: Real backup / restore (Issue #72 part 2) — through the native UI on the private TEST server: state + report files, plan, verify, confirmed restore, prune, recover, role denial
        run: |
          node scripts/build_native_app.js --server
          SHOTS_DIR=artifacts/backup_screens E2E_CALLS_OUT=artifacts/secure_calls_backup.json node scripts/e2e_backup_restore_browser.js
      - name: Secure documents (Issue #72 part 3) — real upload through the file picker, content guard refusals, real byte-identical download, role denial
        run: |
          node scripts/build_native_app.js --server
          E2E_CALLS_OUT=artifacts/secure_calls_documents.json node scripts/e2e_documents_browser.js
      - run: node scripts/e2e_native_ux.js preview artifacts/ux_screens
      - run: node scripts/e2e_native_motion.js preview
      - run: node scripts/e2e_native_sheets.js preview
      - run: BULK_OUT=artifacts/bulk_nav_metrics.json node scripts/e2e_native_bulk_nav.js preview artifacts/bulk_screens
      - run: node scripts/e2e_native_bulk_modules.js preview
      - run: node scripts/test_hebrew_lint.js
      - run: node scripts/e2e_native_mgmt.js preview
      - run: node scripts/e2e_native_bulk_reliability.js preview
      - run: node scripts/e2e_native_entry.js preview
      - name: PDF/XLSX verification tools (qpdf, poppler, openpyxl) — real files are opened and parsed, not assumed
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf poppler-utils python3-openpyxl
      - run: node scripts/test_reportkit.js
      - run: E2E_CALLS_OUT=artifacts/calls_native_insight.json node scripts/e2e_native_insight.js preview artifacts/insight_screens
      - run: node scripts/e2e_native_insight_privacy.js preview
      - run: node scripts/e2e_native_course_privacy.js preview
      - run: node scripts/e2e_native_exam_insight.js preview artifacts/exam_screens
      - run: node scripts/e2e_native_shoot_insight.js preview artifacts/shoot_screens
      - run: node scripts/e2e_native_fit_insight.js preview artifacts/fit_screens
      - name: One-action TEST package (Issue #70) — Linux E2E of a clean extraction (the distributable ZIP + Windows proof are built by release-package.yml)
        run: |
          node tests/selfsigned.js
          node scripts/e2e_release_package.js artifacts/package_screens
      - name: Route evidence ledger (generated from the browser runs)
        run: node scripts/build_route_ledger.js artifacts artifacts/ledger
      - name: Enforce truthful route ledger counts and native-screen evidence
        run: |
          node scripts/check_route_ledger.js artifacts/ledger/route-evidence-ledger.json
          node scripts/check_route_ledger.js docs/route-evidence-ledger.json
          node scripts/check_contract_route_parity.js
          node scripts/build_env_ledger.js --check
      - name: Design parity screenshots (original PR #10 vs native)
        run: |
          test -s golden-source/preview/index.html
          node scripts/native_screenshots.js golden-source/preview/index.html preview artifacts/design_parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-parity-and-ledger
          path: |
            artifacts/design_parity
            artifacts/home_screens
            artifacts/batch3_screens
            artifacts/qa_screens
            artifacts/batch6_screens
            artifacts/batch7_screens
            artifacts/fitness_screens
            artifacts/tasks_screens
            artifacts/secure_screens
            artifacts/report_screens
            artifacts/backup_screens
            artifacts/secure_calls_backup.json
            artifacts/report_downloads
            artifacts/secure_calls_reports.json
            artifacts/ux_screens
            artifacts/package_screens
            artifacts/ledger
            artifacts/calls_*.json
          if-no-files-found: ignore
