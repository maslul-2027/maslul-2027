name: Unified course mobile browser E2E
on:
  pull_request:
    paths:
      - 'preview/**'
      - 'scripts/build_course_preview.cjs'
      - 'scripts/unified_mobile_shell.cjs'
      - 'scripts/e2e_unified_mobile.cjs'
      - '.github/workflows/mobile-browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: c9bc782df72fe1ab91016c003b65f2e3d82a58e8
          path: legacy-source
          sparse-checkout: |
            /src/
            /tests/harness.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build_course_preview.cjs legacy-source
      - run: python3 -m http.server 8787 --directory preview > /tmp/maslul-http.log 2>&1 &
      - run: node scripts/e2e_unified_mobile.cjs
